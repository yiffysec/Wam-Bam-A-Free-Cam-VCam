name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [created]

jobs:
  # Semantic check against a real iOS SDK, on Linux.
  #
  # The macOS jobs below produce the actual packages, but hosted macOS arm64
  # runners are capacity-constrained and can sit queued for a long time or not
  # be acquired at all. Compiling is the only way to catch a real error, so this
  # job does it somewhere always available: clang can target arm64-apple-ios
  # with the real SDK and report every syntax and semantic error without
  # producing an object file, so no Mach-O linker is needed.
  check:
    name: syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang and perl
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang perl

      - name: Cache Theos and SDK
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-linux-check-v1

      - name: Fetch Theos and one iOS SDK
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone -q --recursive --depth 1 \
            https://github.com/theos/theos.git ~/theos

          # Theos ships sdks/ with a .keep placeholder, so cloning into it
          # fails with "already exists and is not an empty directory".
          rm -rf ~/theos/sdks

          # Sparse checkout: the SDK repo carries every SDK and is well over a
          # gigabyte, but one is enough to check against.
          git clone -q --depth 1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git ~/theos/sdks
          cd ~/theos/sdks
          SDK="$(git ls-tree --name-only HEAD | grep -o 'iPhoneOS[0-9.]*\.sdk' \
                 | sort -V | tail -1)"
          if [ -z "$SDK" ]; then
            echo "could not determine an SDK to check against" >&2
            exit 1
          fi
          echo "using $SDK"
          git sparse-checkout set "$SDK"
          du -sh ~/theos/sdks

      - name: Check
        run: THEOS=$HOME/theos ./tools/syntax-check.sh

  build:
    name: ${{ matrix.scheme }}
    # Intel rather than arm64: the hosted macOS arm64 pool is capacity
    # constrained and repeatedly failed to acquire a runner at all. Theos
    # cross-compiles to arm64 iOS either way, so the host architecture does not
    # affect the output.
    runs-on: macos-26-intel

    # Gated on the Linux check so a scarce macOS runner is never spent on code
    # that does not compile.
    needs: check

    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: roothide
            arch: iphoneos-arm64e
            suffix: roothide
          - scheme: rootless
            arch: iphoneos-arm64
            suffix: rootless
          - scheme: rootful
            arch: iphoneos-arm
            suffix: rootful

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Theos
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-${{ matrix.scheme }}-${{ runner.os }}-v2

      - name: Install Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          if [ "${{ matrix.scheme }}" = "roothide" ]; then
            # roothide needs its own Theos fork for jbroot() path rewriting.
            git clone --recursive https://github.com/roothide/theos.git ~/theos
          else
            git clone --recursive https://github.com/theos/theos.git ~/theos
          fi

      - name: Install iOS SDK
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/theos/sdks
          cd ~/theos/sdks
          curl -sSL -o sdk.tar.gz \
            https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar -xzf sdk.tar.gz --strip-components=1
          rm -f sdk.tar.gz
          # Keep only the newest SDK to stay well inside the cache size limit.
          newest="$(ls -d iPhoneOS*.sdk | sort -V | tail -1)"
          echo "keeping $newest"
          for d in iPhoneOS*.sdk; do
            [ "$d" = "$newest" ] || rm -rf "$d"
          done
          ls -1

      - name: Install ldid
        run: |
          set -euo pipefail
          brew install ldid || brew install ldid-procursus || true
          ldid -v || true

      - name: Set package architecture
        run: |
          set -euo pipefail
          sed -i '' 's/^Architecture: .*/Architecture: ${{ matrix.arch }}/' \
            layout/DEBIAN/control
          grep '^Architecture:' layout/DEBIAN/control

      - name: Build
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          echo "THEOS=$THEOS"
          ls "$THEOS/sdks" || true

          if [ "${{ matrix.scheme }}" = "rootful" ]; then
            make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=
          else
            make package FINALPACKAGE=1 \
                 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }}
          fi

      - name: Rename artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          for f in packages/*.deb; do
            base="$(basename "$f" .deb)"
            cp "$f" "dist/${base}-${{ matrix.suffix }}.deb"
          done
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wambamvcam-${{ matrix.suffix }}
          path: dist/*.deb
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
